<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZETI — Ведение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0B0B0A; --black-2:#161614; --black-3:#1E1E1B;
    --ivory:#EDE8DE; --ivory-dim:#55504A;
    --red:#B31217; --red-dim:#6E0C0F; --red-soft:rgba(179,18,23,0.18);
    --grey:#8A857C; --line:rgba(237,232,222,0.13); --cut:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--black); color:var(--ivory);
    font-family:'Inter',system-ui,sans-serif; font-size:15px; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1;}

  /* ---- splash intro ---- */
  #splash{position:fixed; inset:0; background:var(--black); z-index:999; display:flex; align-items:center;
    justify-content:center; flex-direction:column; overflow:hidden;}
  #splash::before{content:''; position:absolute; top:0; bottom:0; width:45%;
    background:linear-gradient(100deg, transparent, rgba(179,18,23,0.35), transparent);
    transform:translateX(-160%); animation:sweep 1.3s ease forwards .15s;}
  @keyframes sweep{ to{transform:translateX(260%);} }
  #splash img{height:88px; opacity:0; animation:splashIn .9s cubic-bezier(.2,.8,.2,1) forwards .1s; position:relative; z-index:1;}
  #splash .tag{font-family:'Barlow Condensed'; font-style:italic; font-weight:700; font-size:13px;
    letter-spacing:1.5px; color:var(--red); margin-top:16px; opacity:0;
    animation:splashIn .7s ease forwards .55s; position:relative; z-index:1;}
  @keyframes splashIn{ from{opacity:0; transform:translateY(16px) scale(.94);} to{opacity:1; transform:translateY(0) scale(1);} }
  #splash.hide{animation:splashOut .5s ease forwards;}
  @keyframes splashOut{ to{opacity:0; visibility:hidden;} }

  /* ---- ambient particles ---- */
  #particles{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .particle{position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%;
    background:var(--red); opacity:.45; animation:rise linear infinite;}
  @keyframes rise{ to{ transform:translateY(-115vh) translateX(var(--dx,0px)); opacity:0;} }

  header{background:var(--black); padding:26px 20px 16px; text-align:center; position:relative; border-bottom:1px solid var(--line);}
  header::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, var(--red-dim), var(--red) 30%, #ff4b4b 50%, var(--red) 70%, var(--red-dim));
    background-size:220% 100%; animation:shine 5s linear infinite;}
  @keyframes shine{ 0%{background-position:220% 0;} 100%{background-position:-220% 0;} }
  .logo-wrap{position:relative; display:inline-block;}
  .logo-glow{position:absolute; inset:-22px; background:radial-gradient(circle, var(--red) 0%, transparent 68%);
    filter:blur(16px); opacity:.35; animation:pulseGlow 3.2s ease-in-out infinite; z-index:0;}
  @keyframes pulseGlow{ 0%,100%{opacity:.28; transform:scale(1);} 50%{opacity:.55; transform:scale(1.12);} }
  .logo{height:52px; display:block; margin:0 auto; position:relative; z-index:1;}
  .level-switch{display:flex; justify-content:center; gap:0; margin-top:14px; position:relative; z-index:1;}
  .level-switch button{background:none; border:1px solid var(--line); border-right:none; color:var(--grey);
    font-family:'Barlow Condensed'; font-weight:700; font-size:12.5px; padding:6px 12px; cursor:pointer; transition:background .2s,color .2s;}
  .level-switch button:last-child{border-right:1px solid var(--line);}
  .level-switch button.active{background:var(--red); color:var(--ivory); border-color:var(--red);}

  main{flex:1; padding:22px 20px 104px; overflow-y:auto;}
  .view{display:none;}
  .view.active{display:block; animation:fadeIn .22s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateX(6px);} to{opacity:1; transform:translateX(0);} }

  .section-title{font-family:'Barlow Condensed'; font-weight:700; font-style:italic;
    font-size:26px; margin:2px 0 16px;}
  .sub-title{font-family:'Barlow Condensed'; font-weight:700; font-style:italic; color:var(--red);
    font-size:16px; margin:22px 0 10px;}

  .panel{background:var(--black-2); padding:18px; margin-bottom:20px;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%);}
  .row-flex{display:flex; flex-direction:column; gap:12px;}
  .field{display:flex; flex-direction:column; gap:5px; flex:1;}
  .field label{font-size:11.5px; color:var(--grey);}
  .fields{display:flex; gap:12px;}
  input, textarea, select{background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--ivory); font-family:'Inter'; font-size:15px; padding:6px 2px; width:100%; outline:none;}
  select{-webkit-appearance:none; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--grey) 50%),linear-gradient(135deg,var(--grey) 50%,transparent 50%);
    background-position:calc(100% - 12px) 14px, calc(100% - 7px) 14px; background-size:5px 5px; background-repeat:no-repeat;}
  input:focus, textarea:focus, select:focus{border-bottom-color:var(--red);}
  input::placeholder, textarea::placeholder{color:var(--grey);}
  textarea{resize:vertical; min-height:60px; border:1px solid var(--line); padding:10px;}

  button.primary{background:var(--red); color:var(--ivory); border:none; padding:13px 18px;
    font-family:'Inter'; font-weight:600; font-size:14px; cursor:pointer; margin-top:2px;
    clip-path:polygon(0 0, 100% 0, 100% 100%, 10px 100%);}
  button.primary:active{background:var(--red-dim);}
  button.ghost{background:none; border:1px solid var(--line); color:var(--ivory); padding:10px 14px;
    font-size:13px; cursor:pointer; font-family:'Inter'; font-weight:500;}

  .rings{display:flex; justify-content:space-between; margin-bottom:20px;}
  .ring-item{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .ring-item .val{font-size:11px; color:var(--grey); font-variant-numeric:tabular-nums;}
  .ring-item .lbl{font-size:10.5px; color:var(--grey);}

  .day-group{margin-top:18px;}
  .day-label{font-family:'Barlow Condensed'; font-style:italic; font-weight:700; color:var(--red); font-size:15px; margin-bottom:6px;}
  .row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;}
  .row .meta{color:var(--grey); font-variant-numeric:tabular-nums; font-size:13.5px;}
  .empty{color:var(--grey); font-size:13.5px; padding:24px 0; text-align:center; border:1px dashed var(--line);}

  .recipe-card{background:var(--black-3); padding:14px; margin-bottom:10px; border-left:2px solid var(--red);}
  .recipe-card .name{font-family:'Barlow Condensed'; font-weight:700; font-style:italic; font-size:17px;}
  .recipe-card .macros{font-size:12.5px; color:var(--grey); margin:4px 0 8px; font-variant-numeric:tabular-nums;}
  .recipe-card .steps{font-size:13.5px; color:var(--ivory-dim,#c9c4ba); line-height:1.5; display:none;}
  .recipe-card .steps.open{display:block;}
  .recipe-card .toggle{font-size:12px; color:var(--red); cursor:pointer; font-weight:600;}

  .supp-item{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line);}
  .supp-info .time{font-size:12px; color:var(--grey); margin-top:2px;}
  .check{width:24px; height:24px; border:1px solid var(--grey); flex:0 0 auto; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ivory);
    clip-path:polygon(0 0, 100% 0, 100% 100%, 5px 100%);}
  .check.on{background:var(--red); border-color:var(--red);}

  .ai-note{font-size:12.5px; color:var(--grey); line-height:1.55; margin-bottom:16px; padding:14px; border:1px solid var(--line);}
  .ai-output{margin-top:16px; padding:16px 0 0; border-top:1px solid var(--line); font-size:14.5px; line-height:1.6; white-space:pre-wrap;}
  .ai-output.loading{color:var(--grey); font-style:italic;}

  .camera-box{border:1px dashed var(--line); padding:20px; text-align:center; margin-bottom:14px; position:relative;}
  .camera-box img{max-width:100%; max-height:160px; margin-top:10px;}
  .camera-box input[type=file]{display:none;}
  .camera-box label{color:var(--red); font-weight:600; font-size:13.5px; cursor:pointer;}

  .segmented{display:flex; margin-bottom:16px;}
  .segmented button{flex:1; background:var(--black-2); border:1px solid var(--line); color:var(--grey);
    font-family:'Barlow Condensed'; font-weight:700; font-size:13px; padding:9px 4px; cursor:pointer;}
  .segmented button.active{background:var(--red); color:var(--ivory); border-color:var(--red);}
  .segmented button:not(:last-child){border-right:none;}

  nav#tabbar{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    display:flex; background:var(--black-2); border-top:1px solid var(--line); z-index:2;}
  #tab-indicator{position:absolute; top:0; left:0; width:25%; height:2px; background:var(--red);
    transition:transform .28s cubic-bezier(.3,.9,.3,1); box-shadow:0 0 8px var(--red);}
  nav#tabbar button{flex:1; background:none; border:none; color:var(--grey); padding:12px 3px 11px;
    font-family:'Barlow Condensed'; font-weight:700; font-size:12px; cursor:pointer; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:3px; transition:color .2s, transform .15s;}
  nav#tabbar button svg{width:18px; height:18px; stroke:currentColor; transition:transform .2s;}
  nav#tabbar button.active{color:var(--ivory);}
  nav#tabbar button.active svg{transform:translateY(-1px) scale(1.08);}
  nav#tabbar button:active{transform:scale(.94);}

  @keyframes cardIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .day-group, .recipe-card, .supp-item, .row{ animation:cardIn .35s ease both; }
  .ring-progress{ transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
  button.primary{ position:relative; overflow:hidden; }
  button.primary:active{ transform:scale(.98); }
</style>
</head>

<script>
// ================= Telegram =================
try{
  if(window.Telegram && window.Telegram.WebApp){ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
}catch(e){}

// ================= splash =================
setTimeout(()=>{
  const s = document.getElementById('splash');
  s.classList.add('hide');
  setTimeout(()=>s.remove(), 550);
}, 1500);

// ================= ambient particles =================
(function particles(){
  const box = document.getElementById('particles');
  const n = 16;
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100+'%';
    p.style.setProperty('--dx', (Math.random()*60-30)+'px');
    const dur = 6 + Math.random()*8;
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = (Math.random()*dur)+'s';
    p.style.opacity = (0.2 + Math.random()*0.4).toFixed(2);
    box.appendChild(p);
  }
})();

// ================= number count-up =================
function animateNumber(el, to, duration=650){
  const from = 0; const start = performance.now();
  function step(t){
    const p = Math.min(1, (t-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(from + (to-from)*eased);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ================= storage helpers (localStorage — works standalone & in Telegram) =================
const _mem = {};
function lsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return (key in _mem) ? _mem[key] : null; } }
function lsSet(key, val){ try{ localStorage.setItem(key, val); }catch(e){ _mem[key] = val; } }
async function loadArr(key){ const v = lsGet(key); try{ return v ? JSON.parse(v) : []; }catch(e){ return []; } }
async function loadObj(key){ const v = lsGet(key); try{ return v ? JSON.parse(v) : {}; }catch(e){ return {}; } }
async function saveVal(key, val){ lsSet(key, JSON.stringify(val)); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); }

// ================= tabs + swipe =================
const TABS = ['nutrition','training','supplements','progress'];
function showTab(name){
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.getElementById('tab-indicator').style.transform = `translateX(${TABS.indexOf(name)*100}%)`;
}
document.querySelectorAll('#tabbar button').forEach(btn=>btn.addEventListener('click',()=>showTab(btn.dataset.view)));
(function swipe(){
  const main = document.getElementById('main');
  let sx=0, sy=0;
  main.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
  main.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    const cur = document.querySelector('#tabbar button.active').dataset.view;
    let idx = TABS.indexOf(cur);
    idx = dx < 0 ? Math.min(idx+1, TABS.length-1) : Math.max(idx-1, 0);
    showTab(TABS[idx]);
  }, {passive:true});
})();

(async function initLevel(){

  document.getElementById('pr-period-wrap').style.display = (level==='Новичок') ? 'none' : 'flex';
}
document.querySelectorAll('#level-switch button').forEach(b=>{
  b.addEventListener('click', async ()=>{

});

// ================= macro rings =================
const RING_R = 27, RING_C = 2*Math.PI*RING_R;
function ringSVG(size, idx){
  const r = RING_R;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(237,232,222,0.12)" stroke-width="5"/>
    <circle class="ring-progress" data-ring="${idx}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#B31217" stroke-width="5"
      stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}
async function renderRings(){
  const targets = await loadObj('zeti:targets');
  const meals = await loadArr('zeti:meal-log');
  const t = meals.filter(m=>m.date===today());
  const sum = t.reduce((a,m)=>({cal:a.cal+m.calories, protein:a.protein+m.protein, carbs:a.carbs+m.carbs, fat:a.fat+m.fat}), {cal:0,protein:0,carbs:0,fat:0});
  const items = [
    {lbl:'Ккал', val:sum.cal, goal:targets.cal||0},
    {lbl:'Белки', val:sum.protein, goal:targets.protein||0},
    {lbl:'Углев.', val:sum.carbs, goal:targets.carbs||0},
    {lbl:'Жиры', val:sum.fat, goal:targets.fat||0},
  ];
  document.getElementById('macro-rings').innerHTML = items.map((i,idx)=>`
    <div class="ring-item">${ringSVG(66, idx)}
      <div class="val" id="ring-val-${idx}">0${i.goal?'/'+i.goal:''}</div><div class="lbl">${i.lbl}</div></div>
  `).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    items.forEach((i,idx)=>{
      const pct = i.goal ? Math.max(0,Math.min(100, i.val/i.goal*100)) : 0;
      const circle = document.querySelector(`.ring-progress[data-ring="${idx}"]`);
      if(circle) circle.style.strokeDashoffset = RING_C - (pct/100*RING_C);
      const valEl = document.getElementById('ring-val-'+idx);
      if(valEl){
        let shown = 0;
        const dur=700, start=performance.now();
        function step(t){ const p=Math.min(1,(t-start)/dur); shown = Math.round(i.val*(1-Math.pow(1-p,3)));
          valEl.textContent = shown + (i.goal?'/'+i.goal:''); if(p<1) requestAnimationFrame(step); }
        requestAnimationFrame(step);
      }
    });
  }));
  document.getElementById('t-cal').value = targets.cal||''; document.getElementById('t-protein').value = targets.protein||'';
  document.getElementById('t-carbs').value = targets.carbs||''; document.getElementById('t-fat').value = targets.fat||'';
}
document.getElementById('t-save').addEventListener('click', async ()=>{
  await saveVal('zeti:targets', {cal:+document.getElementById('t-cal').value||0, protein:+document.getElementById('t-protein').value||0,
    carbs:+document.getElementById('t-carbs').value||0, fat:+document.getElementById('t-fat').value||0});
  renderRings();
});

// ================= meals =================
async function renderMeals(){
  const meals = await loadArr('zeti:meal-log');
  const t = meals.filter(m=>m.date===today());
  const el = document.getElementById('meal-log');
  if(!t.length){ el.innerHTML = '<div class="empty">Сегодня пока нет записей</div>'; return; }
  const byType = {};
  t.forEach(m=>{ (byType[m.meal] ||= []).push(m); });
  el.innerHTML = Object.keys(byType).map(type=>`
    <div class="day-group"><div class="day-label">${type}</div>
    ${byType[type].map(m=>`<div class="row"><span>${m.name}</span><span class="meta">${m.calories} ккал</span></div>`).join('')}
    </div>`).join('');
}
document.getElementById('m-add').addEventListener('click', async ()=>{
  const name = document.getElementById('m-name').value.trim();
  const cal = +document.getElementById('m-cal').value;
  if(!name || !cal) return;
  const meals = await loadArr('zeti:meal-log');
  meals.push({date:today(), meal:document.getElementById('m-type').value, name, calories:cal,
    protein:+document.getElementById('m-protein').value||0, carbs:+document.getElementById('m-carbs').value||0, fat:+document.getElementById('m-fat').value||0});
  await saveVal('zeti:meal-log', meals);
  ['m-name','m-cal','m-protein','m-carbs','m-fat'].forEach(id=>document.getElementById(id).value='');
  renderMeals(); renderRings();
});

// ================= bodyweight =================
async function renderChart(){
  const log = (await loadArr('zeti:bodyweight-log')).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const svg = document.getElementById('bw-chart'), empty = document.getElementById('chart-empty');
  if(log.length < 2){ svg.style.display='none'; empty.style.display='block'; return; }
  empty.style.display='none'; svg.style.display='block';
  const vals = log.map(l=>l.weight); const min = Math.min(...vals)-0.5, max = Math.max(...vals)+0.5;
  const w=300,h=90,pad=10;
  const pts = log.map((l,i)=>{
    const x = pad + i*(w-2*pad)/(log.length-1);
    const y = pad + (1-(l.weight-min)/(max-min))*(h-2*pad);
    return `${x},${y}`;
  }).join(' ');
  svg.innerHTML = `<polyline points="${pts}" fill="none" stroke="#B31217" stroke-width="2.5"/>
    ${log.map((l,i)=>{ const x=pad+i*(w-2*pad)/(log.length-1); const y=pad+(1-(l.weight-min)/(max-min))*(h-2*pad);
      return `<circle cx="${x}" cy="${y}" r="3" fill="#EDE8DE"/>`; }).join('')}`;
}
document.getElementById('bw-add').addEventListener('click', async ()=>{
  const w = +document.getElementById('bw-input').value; if(!w) return;
  const log = await loadArr('zeti:bodyweight-log');
  const idx = log.findIndex(l=>l.date===today());
  if(idx>=0) log[idx].weight = w; else log.push({date:today(), weight:w});
  await saveVal('zeti:bodyweight-log', log);
  document.getElementById('bw-input').value=''; renderChart();
});

];
async function allRecipes(){ return [...BASE_RECIPES, ...(await loadArr('zeti:custom-recipes'))]; }
function recipeCard(r){
  return `<div class="recipe-card">
    <div class="name">${r.name}</div>
    <div class="macros">${r.macros.cal} ккал · Б ${r.macros.protein} · У ${r.macros.carbs} · Ж ${r.macros.fat}</div>
    <div class="toggle">Показать приготовление</div>
    <div class="steps">${r.steps}</div>
  </div>`;
}
function bindRecipeToggles(container){
  container.querySelectorAll('.recipe-card').forEach(card=>{
    card.querySelector('.toggle').addEventListener('click', ()=>{
      const steps = card.querySelector('.steps'); steps.classList.toggle('open');
      card.querySelector('.toggle').textContent = steps.classList.contains('open') ? 'Скрыть' : 'Показать приготовление';
    });
  });
}
document.getElementById('ing-search').addEventListener('click', async ()=>{
  const input = document.getElementById('ing-input').value.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
  const el = document.getElementById('recipe-results');
  if(!input.length){ el.innerHTML = '<div class="empty">Введите продукты</div>'; return; }
  const recipes = await allRecipes();
  const scored = recipes.map(r=>({r, score: r.ingredients.filter(i=>input.some(q=>i.includes(q)||q.includes(i))).length}))
    .filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  el.innerHTML = scored.length ? scored.map(x=>recipeCard(x.r)).join('') : '<div class="empty">Ничего не найдено в базе — попробуйте спросить ИИ</div>';
  bindRecipeToggles(el);
});

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:700,

// ================= AI program builder =================
document.getElementById('pr-gen').addEventListener('click', async ()=>{
  const out = document.getElementById('pr-output');
  out.className = 'ai-output loading'; out.textContent = 'Строю программу…';
  const settings = await loadObj('zeti:settings');
  const level = settings.level || 'Новичок';
  const style = document.getElementById('pr-style').value;
  const days = document.getElementById('pr-days').value || 4;
  const period = level==='Новичок' ? 'простая линейная прогрессия' : document.getElementById('pr-period').value;
  const goal = document.getElementById('pr-goal').value.trim();
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1200,
        system:'Ты — тренер по силовой подготовке и бодибилдингу. Составляй тренировочные программы: список упражнений по дням, подходы/повторения, принцип прогрессии. Не давай советов по фармакологии, дозировкам или инъекциям ни при каких условиях.',
        messages:[{role:'user', content:`Составь тренировочную программу.\nУровень: ${level}\nСтиль: ${style}\nДней в неделю: ${days}\nПериодизация: ${period}\nДополнительно: ${goal||'нет'}\nФормат: по дням, с упражнениями, подходами и повторениями.`}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    out.className='ai-output'; out.textContent = text || 'Не удалось сгенерировать.';
    await saveVal('zeti:program', {text, date:today()});
  }catch(e){ out.className='ai-output'; out.textContent = 'Ошибка генерации.'; }
});

let eqImageData = null, eqImageType = null;
document.getElementById('eq-photo').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  eqImageType = file.type;
  const reader = new FileReader();
  reader.onload = () => {
    eqImageData = reader.result.split(',')[1];
    document.getElementById('eq-preview').innerHTML = `<img src="${reader.result}">`;
  };
  reader.readAsDataURL(file);
});

  out.className='ai-output loading'; out.textContent='Распознаю тренажёр…';
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {

// ================= supplements =================
async function renderSupplements(){
  const items = await loadArr('zeti:supplements');
  const takenLog = await loadObj('zeti:supplement-log');
  const takenToday = takenLog[today()] || [];
  const el = document.getElementById('sp-list');
  if(!items.length){ el.innerHTML = '<div class="empty">Список пуст</div>'; return; }
  el.innerHTML = items.map(it=>`
    <div class="supp-item"><div class="supp-info"><div>${it.name}</div><div class="time">${it.time||''}</div></div>
    <div class="check ${takenToday.includes(it.id)?'on':''}" data-id="${it.id}">${takenToday.includes(it.id)?'✓':''}</div></div>
  `).join('');
  el.querySelectorAll('.check').forEach(c=>c.addEventListener('click', async ()=>{
    const id = c.dataset.id; const log = await loadObj('zeti:supplement-log');
    const list = log[today()] || [];
    log[today()] = list.includes(id) ? list.filter(x=>x!==id) : [...list, id];
    await saveVal('zeti:supplement-log', log); renderSupplements();
  }));
}
document.getElementById('sp-add').addEventListener('click', async ()=>{
  const name = document.getElementById('sp-name').value.trim(); const time = document.getElementById('sp-time').value.trim();
  if(!name) return;
  const items = await loadArr('zeti:supplements'); items.push({id:'s'+Date.now(), name, time});
  await saveVal('zeti:supplements', items);
  document.getElementById('sp-name').value=''; document.getElementById('sp-time').value='';
  renderSupplements();
});
